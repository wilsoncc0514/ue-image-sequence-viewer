name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v3.6
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际结果与预期结果，避免附带敏感素材或业务数据。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开……\n2. 选择……\n3. 出现……"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: macOS 15 / Python 3.12

