name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          ruff check .
          mypy
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Run unit tests
        working-directory: 图形序列查看器
        run: python -m unittest discover -s tests -v
      - name: Install virtual display
        if: matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Run real Tk regressions
        if: matrix.python-version == '3.14'
        working-directory: 图形序列查看器
        run: xvfb-run -a env RUN_GUI_TESTS=1 python -m unittest tests.test_gui_integrity tests.test_gui_motion tests.test_gui_smoke -v

  windows-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Run unit tests
        working-directory: 图形序列查看器
        env:
          RUN_GUI_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Verify Windows launcher and Tk startup
        working-directory: 图形序列查看器
        shell: cmd
        run: call "启动图形序列查看器-Windows.bat" --smoke-test
