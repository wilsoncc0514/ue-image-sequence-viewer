name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          ruff check .
          mypy
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Run unit tests
        working-directory: 图形序列查看器
        run: python -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          ruff check .
          mypy
      - name: Run unit tests
        working-directory: 图形序列查看器
        run: python -m unittest discover -s tests -v
      - name: Verify Windows launcher and Tk startup
        working-directory: 图形序列查看器
        shell: cmd
        run: call "启动图形序列查看器.bat" --smoke-test
